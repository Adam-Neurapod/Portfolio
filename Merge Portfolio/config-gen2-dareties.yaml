models:
  # Base model — bez parametrov, je referenčný bod pre task vektory
  - model: mistralai/Mistral-7B-Instruct-v0.2
  # Lily — jej "task vector" (rozdiel oproti base) je to čo pridávame
  - model: segolilylabs/Lily-Cybersecurity-7B-v0.2
    parameters:
      # density = koľko % zmenených váh si necháme (zvyšok sa zahodí ako redundantný).
      # 0.6 = necháme 60% najvýznamnejších zmien z fine-tuningu.
      # Nižšie = agresívnejšie čistenie, vyššie = viac originálnej Lily.
      density: 0.6
      # weight = ako silno pridáme Lily task vector k base modelu.
      weight: 0.6

merge_method: dare_ties
base_model: mistralai/Mistral-7B-Instruct-v0.2
parameters:
  # int8_mask šetrí pamäť pri výpočte masiek — dôležité pri 8GB VRAM
  int8_mask: true
  # normalize zabezpečí že výsledné váhy zostanú v rozumnom rozsahu
  normalize: true
dtype: float16